<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roomgather</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
</head>
<body>
    <div class="chat-container">
        <div class="header" id="mainHeader">
            <div class="header-left">
                <h1>Roomgather</h1>
                <p class="tagline">Rooms for text, voice & more</p>
            </div>
            <div class="header-actions">
                <!-- Bookmarks button -->
                <button class="search-icon-btn" id="bookmarksIconBtn">
                    <img src="icons/bookmark.png" width="24" height="24" alt="Bookmarks">
                </button>
                <!-- Search button -->
                <button class="search-icon-btn" id="searchIconBtn">
                    <img src="icons/search.png" width="24" height="24" alt="Search">
                </button>
                <!-- Settings button -->
                <button class="settings-icon-btn" id="settingsIconBtn">
                    <img src="icons/settings.png" width="24" height="24" alt="Settings">
                </button>
            </div>
        </div>

        <div class="header search-header" id="searchHeader" style="display:none;">
            <input type="text" id="searchInput" placeholder="Search messages...">
            <button id="clearSearchBtn" class="clear-search">✕</button>
        </div>

<!-- Pinned bar -->
<div class="pinned-bar" id="pinnedBar">
    <div class="pinned-header" id="pinnedHeader">
        <span style="display: flex; align-items: center; gap: 6px;">
            <img src="icons/pin.png" width="14" height="14" alt="Pinned" style="image-rendering: pixelated;">
            <span id="pinnedCount">0</span> pinned
        </span>
        <span class="pinned-toggle" id="pinnedToggle">▾</span>
    </div>
    <div id="pinnedList"></div>
</div>

        <div class="messages" id="messages"></div>

        <div class="bottom-bar">
            <div id="replyIndicator" class="reply-indicator" style="display:none;">
                <span class="reply-text">Replying to: <span id="replyPreviewText"></span></span>
                <button id="cancelReplyBtn" class="cancel-reply">✕</button>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Type a message..."></textarea>
                    <span id="charCounter" class="char-counter-overlay">0</span>
                </div>
                <button class="emoji-btn" id="emojiBtn">
                    <img src="icons/emoji.png" width="24" height="24" alt="Emoji">
                </button>
                <button id="sendBtn">
                    <img src="icons/send.png" width="36" height="36" alt="Send">
                </button>
            </div>
        </div>
    </div>

    <!-- Emoji Picker -->
    <div id="emojiPicker" class="emoji-picker" style="display:none;">
        <div class="emoji-search-bar">
            <input type="text" id="emojiSearch" placeholder="Search">
        </div>
        <div class="emoji-categories" id="emojiCategories"></div>
        <div class="emoji-grid" id="emojiGrid"></div>
        <div class="emoji-preview-footer" id="emojiPreviewFooter">
            <div class="preview-large-emoji" id="previewLargeEmoji">☝️</div>
            <div class="preview-text-block">
                <div class="preview-name" id="previewName">Pick an emoji...</div>
                <div class="preview-shortcode" id="previewShortcode"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal" style="display:none;">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <span class="modal-icon">
                    <img src="icons/settings.png" width="30" height="30" alt="Settings">
                </span>
                <h2>Settings</h2>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label>Font size</label>
                    <select id="fontSizeSelect">
                        <option value="13">Small (13px)</option>
                        <option value="15" selected>Medium (15px)</option>
                        <option value="17">Large (17px)</option>
                    </select>
                    
                </div>
                                    <div class="setting-item">
    <label>Halloween Theme</label>
    <label class="toggle-switch">
        <input type="checkbox" id="themeToggle">
        <span class="toggle-slider"></span>
    </label>
</div>
                <div class="setting-item export-item">
                    <button id="settingsExportBtn" class="settings-export-btn">Export Chat (.txt)</button>
                </div>
                <div class="setting-item version-item">
                    <label>Version</label>
                    <span id="settingsVersion" class="version-text">v0.17</span>
                </div>
            </div>
            <div class="modal-footer">
                <button id="closeSettingsBtn" class="modal-cancel">Close</button>
            </div>
        </div>
    </div>

    <!-- Bookmarks Modal -->
    <div id="bookmarksModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">
                    <img src="icons/bookmark.png" width="30" height="30" alt="Bookmark">
                </span>
                <h2>Bookmarks</h2>
            </div>
            <div class="modal-body" id="bookmarksList" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                <!-- Bookmarks will be injected here -->
            </div>
            <div class="modal-footer">
                <button id="closeBookmarksBtn" class="modal-cancel">Close</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">
                    <img src="icons/delete.png" width="30" height="30" alt="Delete">
                </span>
                <h2>Delete Message?</h2>
            </div>
            <div class="modal-body">
                <p>This message will be permanently deleted. This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button id="deleteCancelBtn" class="modal-cancel">Cancel</button>
                <button id="deleteConfirmBtn" class="modal-confirm">Delete</button>
            </div>
        </div>
    </div>

    <div class="footer-version" id="versionNumber">v0.17</div>

    <script src="script.js"></script>
</body>
</html>
